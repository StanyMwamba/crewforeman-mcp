name: ci

# CI runs on macOS, Linux and Windows. The Windows job uses the pinned
# windows-2025 GitHub-hosted runner (x64/UTC), whose hosted account is an
# Administrators member. Account membership is not token elevation: the 3.13.2
# probe failed before it could establish either fact, so the probe now records
# admin (elevation) and admin_member (account group) separately and logs the
# failing step with the exception class and message. The first real windows-2025
# run (42629362611) failed in that probe before the suite; 3.13.3 fixed it and
# run 42648360100 proved the probe (usable=true on both Pythons) but the suite
# was red. 3.13.7 addresses the 3.13.3 suite failures, so the next windows-2025 run is
# the required Windows evidence for the suite and the write-restricted boundary. The
# standard-user path is still established only by the manual run on the user's
# real Windows 11 arm64 VM. See docs/OPERATIONS.md ("Continuous integration")
# and the Windows VM test package.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The floating Linux label now resolves to Ubuntu 26.04, where
        # actions/setup-python has no Python 3.9 build. Pin the runner that
        # proves the Linux Landlock boundary instead.
        os: [macos-latest, ubuntu-24.04]
        # 3.9 is the supported floor. 3.15 is the newest stable CPython line
        # (3.15.2, released 2026-10-25); actions/setup-python resolves the newest
        # 3.15.x from the live actions/python-versions manifest.
        python: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "${{ matrix.python }}"
      - name: Run CI
        run: bash scripts/ci.sh

  windows:
    name: windows-2025 (py${{ matrix.python }})
    # Pinned: never the floating Windows label. windows-2025 is Windows Server 2025
    # image and ships PowerShell 7, Git Bash, Git and the VS 2022 C++ tools.
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # Diagnostics only: the ACL read-back prints trustee names and flags
      # (never the path) when it rejects a file.
      CF_ACL_DEBUG: "1"
    strategy:
      fail-fast: false
      matrix:
        # actions/python-versions has win32 x64 builds for both lines
        # (3.9.13 and 3.15.2).
        python: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "${{ matrix.python }}"
      - name: Run CI (Windows)
        run: pwsh -NoProfile -File scripts/ci.ps1
