# PEP 621 metadata for crewforeman-mcp v3.12.0.
# The in-tree stdlib-only backend keeps `pip install .` working offline on
# stock Python 3.9, where pip's isolated build env has no setuptools.
[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "crewforeman-mcp"
version = "3.12.0"
description = "Local MCP server exposing DeepSeek agents and DeepSeek Harness runs to any MCP client."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "deepseek", "model-context-protocol", "harness", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/StanyMwamba/crewforeman-mcp"
Repository = "https://github.com/StanyMwamba/crewforeman-mcp"
Issues = "https://github.com/StanyMwamba/crewforeman-mcp/issues"

[project.scripts]
crewforeman-mcp = "deepseek_mcp.server:main"
deepseek-harness-mcp = "deepseek_mcp.server:main"
deepseek-mcp = "deepseek_mcp.server:main"

# Wheel contents (deepseek_mcp/*.py plus skills data files) are defined by
# build_backend.py.  setup.py/setup.cfg exist only as a legacy fallback.
