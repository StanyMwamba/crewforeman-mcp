[metadata]
name = crewforeman-mcp
version = attr: deepseek_mcp.config.SERVER_VERSION
description = Local MCP server exposing DeepSeek agents and DeepSeek Harness runs to any MCP client.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = deepseek_mcp*

[options.package_data]
deepseek_mcp = *.py

[options.data_files]
share/crewforeman-mcp/skills = skills/*.md

[options.entry_points]
console_scripts =
    crewforeman-mcp = deepseek_mcp.server:main
    deepseek-harness-mcp = deepseek_mcp.server:main
    deepseek-mcp = deepseek_mcp.server:main
